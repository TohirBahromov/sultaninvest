# nginx on the VPS host (the same nginx that serves sultanedu.uz).
# Install as /etc/nginx/sites-available/sultaninvest, link into
# sites-enabled, then run certbot for HTTPS (see DEPLOY.md).

limit_req_zone $binary_remote_addr zone=sultaninvest_lead:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sultaninvest.uz www.sultaninvest.uz;

    root /opt/sultaninvest/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;


    # The lead form. The Telegram token lives only in the lead-api container.
    location = /api/lead {
        limit_req zone=sultaninvest_lead burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|mp4|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        # trailingSlash export: /services -> /services/index.html
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
