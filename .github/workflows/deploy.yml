# On every push to main: build the static site and the lead-api image on
# GitHub's machines, upload the site to the VPS, and run deploy/deploy.sh.
# Nothing is built on the server. Setup: see DEPLOY.md.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 3

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lead-api
        uses: docker/build-push-action@v6
        with:
          context: ./lead-api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sultaninvest-lead-api:latest
            ghcr.io/${{ env.OWNER_LC }}/sultaninvest-lead-api:${{ github.sha }}
          cache-from: type=gha,scope=lead-api
          cache-to: type=gha,mode=max,scope=lead-api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site-new

      - name: Upload site, compose file and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "site-new,docker-compose.prod.yml,deploy/deploy.sh"
          target: /opt/sultaninvest
          rm: false

      - name: Switch to the new build
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/sultaninvest
            mv -f deploy/deploy.sh deploy.sh
            chmod +x deploy.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ./deploy.sh
            docker logout ghcr.io
